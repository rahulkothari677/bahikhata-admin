name: CI

# Created 2026-07-26 (audit). Before this, nothing was enforced on push:
# there was no CI workflow, no test framework, no eslint config, and
# next.config.ts suppressed both type and lint errors. A build could be
# red in every meaningful way and still deploy.
#
# Every step here is BLOCKING. If this is red, the app is broken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    env:
      # prisma generate + next build need these to be present, not reachable.
      # No real credentials are used in CI.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3001"
      FOUNDER_EMAILS: "ci@example.com"
      CRON_SECRET: "ci-placeholder"

    steps:
      - uses: actions/checkout@v4

      # The main app's migrations own the money columns in the shared database.
      # This app keeps its own schema copy and has NO migrations directory, so
      # nothing here can detect drift on its own — which is how seven columns
      # came to say Float while the database said integer, silently failing
      # every revenue-recognition and daily-stats WRITE while reads looked fine.
      #
      # tests/money-columns-are-integers.test.ts compares the two. Without this
      # checkout it has nothing to compare against and skips, and a check that
      # skips is a check that passes for the wrong reason. REQUIRE_MAIN_APP
      # makes a missing checkout fail loudly instead.
      #
      # bahikhata-pro is public, so no token is needed.
      - name: Check out the main app (owner of the money schema)
        uses: actions/checkout@v4
        with:
          repository: rahulkothari677/bahikhata-pro
          path: main-app
          sparse-checkout: prisma/migrations
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # MUST run before type-check. A stale client produced 476 phantom
        # type errors during the audit and was the stated reason the previous
        # config disabled type-checking entirely.
        run: npx prisma generate

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          # Point the money-drift guard at the checkout above, and make its
          # absence a failure rather than a silent skip.
          MAIN_APP_PATH: ${{ github.workspace }}/main-app
          REQUIRE_MAIN_APP: '1'

      - name: Build
        run: npm run build
