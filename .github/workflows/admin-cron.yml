name: Admin Cron Jobs

# All cron jobs run via GitHub Actions (free, no Vercel plan limits).
# Vercel Hobby plan only allows 1 daily cron — so we moved everything here.
# GitHub Actions allows up to 6 hours per job and multiple schedules.
#
# REQUIRED SECRETS (set in GitHub repo → Settings → Secrets → Actions):
#   ADMIN_URL    — Your admin panel URL (e.g. https://bahikhata-admin.vercel.app)
#   CRON_SECRET  — Same value as CRON_SECRET env var in Vercel

on:
  schedule:
    # ===== DAILY JOBS =====
    # 2:00 AM UTC (7:30 AM IST) — Daily Stats
    - cron: '0 2 * * *'
    # 5:00 AM UTC (10:30 AM IST) — Anomaly Detection
    - cron: '0 5 * * *'
    # 🐛 FIX (integration-phase-D.1): REMOVED '30 22 * * *' cron entry.
    # It triggered the dead run-credit-scores job (below), which called
    # /api/admin/data-monetization/compute — an endpoint deleted when the
    # lending pipeline was removed for DPDP/RBI regulatory reasons.
    # 12:30 AM UTC (6:00 AM IST) — Churn Predictions (heavy)
    - cron: '30 0 * * *'
    # 3:00 AM UTC (8:30 AM IST) — Revenue Recognition (after daily stats)
    - cron: '0 3 * * *'
    # 🔒 2026-08-04 (Phase 7 audit) — 4:00 AM UTC (9:30 AM IST) — Audit Chain
    # Verification. verifyAuditChain() existed and was correct, but nothing
    # ever called it: seven jobs ran on this schedule and the one that detects
    # tampering with the record of who did what was not among them. A
    # tamper-EVIDENT log nobody inspects is not tamper-evident.
    - cron: '0 4 * * *'
    # ===== FREQUENT JOBS =====
    # Every 15 minutes — Fraud Rules
    - cron: '*/15 * * * *'
    # Every 5 minutes — Bulk Jobs
    - cron: '*/5 * * * *'
    # Every 5 minutes — Webhook Delivery (alternate 5-min slot)
    - cron: '*/5 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - daily-stats
          - anomaly-detection
          # 🐛 FIX (integration-phase-D.1): REMOVED 'credit-scores' option —
          # the job was deleted (called a non-existent endpoint).
          - churn-predictions
          - fraud-rules
          - bulk-jobs
          - webhooks
          - all

jobs:
  # ===== DAILY JOBS (run once per day) =====

  run-daily-stats:
    name: Compute Daily Stats
    if: github.event.inputs.job == 'daily-stats' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily stats compute
        run: |
          echo "🔄 Triggering daily stats computation..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/compute-daily-stats" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Daily stats computed successfully"

  run-anomaly-detection:
    name: Run Anomaly Detection
    if: github.event.inputs.job == 'anomaly-detection' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger anomaly detection
        run: |
          echo "🔄 Triggering anomaly detection..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/anomalies/detect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Anomaly detection completed successfully"

  # ===== HEAVY JOBS (run once per day, need >10s) =====

  # 🐛 FIX (integration-phase-D.1): REMOVED run-credit-scores job.
  # It called /api/admin/data-monetization/compute, which was deleted when
  # the lending pipeline was removed (DPDP/RBI regulatory risk). The job
  # was firing daily at 10:30 PM UTC, hitting a 404, and wasting GHA minutes.
  # If credit-scoring is ever re-introduced, it should use a NEW endpoint
  # with a NEW cron entry — do not resurrect this dead reference.

  run-churn-predictions:
    name: Compute Churn Predictions
    if: github.event.inputs.job == 'churn-predictions' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '30 0 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger churn prediction compute
        run: |
          echo "🔄 Triggering churn prediction computation..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/churn-predictions/compute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Churn predictions computed successfully"

  # 🐛 FIX (audit 2026-07-26): revenue recognition had no schedule at all.
  # RevenueSchedule rows are written in exactly one place and were only ever
  # reached by a human clicking "recompute" in the admin UI. The P&L reads
  # RECOGNISED revenue from RevenueSchedule but cash from Subscription, so the
  # financial report showed Rs.0 revenue while charging gateway fees on real
  # cash. Runs after daily-stats. Idempotent: deleteMany per subscription then
  # createMany, so a re-run produces the same rows.
  run-revenue-recognition:
    name: Recompute Revenue Recognition
    if: github.event.inputs.job == 'revenue-recognition' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger revenue recognition recompute
        run: |
          echo "🔄 Triggering revenue recognition recompute..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/revenue-recognition/recompute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Revenue recognition recomputed successfully"

  # 🔒 2026-08-04 (Phase 7 audit): the audit log is a hash chain, and until this
  # job existed nothing ever recomputed it. The verifier was written, correct
  # and tested — it simply had no callers. Tampering was detectable in theory
  # and undetected in practice, which is worse than no chain at all, because
  # the chain is the reason anyone trusts the log.
  #
  # A non-200 here means the record of every admin action is no longer
  # trustworthy. It must fail the workflow loudly rather than pass quietly.
  verify-audit-chain:
    name: Verify Audit Chain
    if: github.event.inputs.job == 'audit-chain' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the admin audit chain
        run: |
          echo "🔄 Verifying admin audit chain..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ secrets.ADMIN_URL }}/api/admin/audit-chain/verify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ AUDIT CHAIN VERIFICATION FAILED (HTTP $HTTP_CODE)"
            echo "An admin action record was edited, inserted or removed."
            echo "Treat the audit log as untrusted until this is explained."
            exit 1
          fi
          echo "✅ Audit chain intact"

  # ===== FREQUENT JOBS (run every few minutes) =====

  run-fraud-rules:
    name: Evaluate Fraud Rules
    if: github.event.inputs.job == 'fraud-rules' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger fraud rules evaluation
        run: |
          echo "🔄 Triggering fraud rules evaluation..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/fraud-rules/evaluate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Fraud rules evaluated successfully"

  run-bulk-jobs:
    name: Execute Bulk Jobs
    if: github.event.inputs.job == 'bulk-jobs' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger bulk jobs execution
        run: |
          echo "🔄 Triggering bulk jobs execution..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/bulk-jobs/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Bulk jobs executed successfully"

  run-webhooks:
    name: Deliver Pending Webhooks
    if: github.event.inputs.job == 'webhooks' || github.event.inputs.job == 'all' || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger webhook delivery
        run: |
          echo "🔄 Triggering webhook delivery..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/admin/webhooks/deliver" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhooks delivered successfully"
